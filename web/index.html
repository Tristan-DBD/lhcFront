<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LHC">

  <!-- Stratégie de cache anti-blocage pour les mises à jour automatiques -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Service Worker Update Strategy -->
  <meta name="service-worker-update" content="force" />
  <meta name="flutter-service-worker" content="/flutter_service_worker.js" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LHC">
  <link rel="apple-touch-icon" href="/app-logo-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/app-logo-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/app-logo-512.png">

  <!-- Favicon et icônes PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-new.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/app-logo-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app-logo-512.png">
  <link rel="shortcut icon" href="/favicon-new.png">

  <title>LHC</title>
  <link rel="manifest" href="/lhc-verified-v5.json">

  <style>
    body {
      inset: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      position: fixed;
      user-select: none;
      touch-action: none;
      background-color: #000;
      /* Fond noir profond */
    }

    #loading {
      align-items: center;
      display: flex;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle, #0175C2 0%, #000 70%);
      /* Dégradé radial avec votre bleu */
      transition: opacity 0.4s ease-out;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    .logo-container {
      position: relative;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading img {
      width: 200px;
      /* Ajustez selon vos besoins */
      height: auto;
      filter: drop-shadow(0 0 15px rgba(1, 117, 194, 0.6));
      /* Lueur bleue */
    }

    /* Animation de pulsation douce */
    @keyframes pulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(1, 117, 194, 0.4));
      }

      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 30px rgba(1, 117, 194, 0.8));
      }

      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(1, 117, 194, 0.4));
      }
    }

    .loading-bar {
      position: absolute;
      bottom: 20%;
      width: 150px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-bar::after {
      content: "";
      position: absolute;
      left: -50%;
      width: 50%;
      height: 100%;
      background: #0175C2;
      animation: progress 1.5s infinite linear;
    }

    @keyframes progress {
      0% {
        left: -50%;
      }

      100% {
        left: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- SCRIPT DE NETTOYAGE NUCLÉAIRE (Anti-Cache) -->
  <script>
    (function () {
      const APP_VERSION = 'v0.5'; // Synchronisé avec le Détonateur Nginx
      const currentVersion = localStorage.getItem('lhc_app_version');

      if (currentVersion !== APP_VERSION) {
        console.log('Nouvelle version détectée ! Nettoyage du cache en cours...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          }).then(function () {
            localStorage.setItem('lhc_app_version', APP_VERSION);
            // On vide aussi le cache des fichiers
            if ('caches' in window) {
              caches.keys().then(function (names) {
                for (let name of names) caches.delete(name);
              });
            }
            window.location.reload(true);
          });
        } else {
          localStorage.setItem('lhc_app_version', APP_VERSION);
        }
      }
    })();
  </script>

  <div id="loading">
    <div class="logo-container">
      <img src="app-logo-192.png" alt="LHC Logo">
    </div>
    <div class="loading-bar"></div>
    <div id="update-message"
      style="display:none; color: white; font-family: sans-serif; margin-top: 20px; font-size: 14px; opacity: 0.8;">
      Mise à jour de l'application...
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // --- GESTION AUTO-UPDATE SENIOR-PROOF ---

    // 1. Détection de mise à jour robuste
    const updateHandler = (reg) => {
      if (!reg) return;

      // On force une vérification immédiate
      reg.update();

      reg.onupdatefound = () => {
        const newWorker = reg.installing;
        if (!newWorker) return;

        newWorker.onstatechange = () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('Nouvelle version trouvée ! Préparation du rechargement...');

            // Feedback visuel (le message qu'on a déjà dans le HTML)
            const msg = document.getElementById('update-message');
            if (msg) msg.style.display = 'block';

            // On dit au nouveau SW de "passer devant"
            newWorker.postMessage({ type: 'SKIP_WAITING' });
          }
        };
      };
    };

    // 2. Écouter l'enregistrement fait par Flutter
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(updateHandler);

      // Relance automatique quand le nouveau SW prend le pouvoir
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        console.log('Nouvelle version activée ! Rechargement de la page...');
        window.location.reload();
      });
    }

    // Fonction pour enlever l'écran de chargement
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.remove();
        }, 400);
      }
    });
  </script>
</body>

</html>
